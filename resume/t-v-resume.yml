    url: https://t-v.github.io/resume/
    summary: |
      *What can go wrong, will go wrong! Therefore, we need to test every aspect, every time.*

      - Architect with a track record since 2007, of which over a decade spent in the DevOps culture: automating lifecycles, designing platforms and coaching the teams that run them
      - Designs and delivers cloud and container architectures on Azure, GCP and AWS, with Kubernetes, Ansible and GitOps as the backbone
      - Translates business requirements into architectures that survive contact with reality, from pre-sales proof of concept to production hand-over
      - Comfortable at both ends of the stack: hardware and virtualization lifecycles on one side, GenAI and retrieval architectures on the other
      - Leads by enabling: competence center lead, coach and mentor who prefers raising the team's baseline over being the single point of knowledge

  location:
