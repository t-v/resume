  work:
    - name: SAS nv
      url: https://www.sas.com/
      position: Senior Integration Architect
      startDate: "2023-11"
      endDate:
      summary: |
        As I became part of the R&D IoT department, my main focus is delivering steady architectures and proof of concepts to improve the current SAS offering for edge devices.

        The most visible result of this is **SAS Retrieval Agent Manager**. It started out as my GenAI proof of concept, an application that allows customers to enhance their data and documents, and query them as if you were having a natural conversation. Since then it has grown into a full SAS offering, built as a direct continuation of the architecture and the development I delivered, and it has fully moved to our development department which now owns the product and its release cycle.

        - Architected and built the GenAI/RAG proof of concept that grew into SAS Retrieval Agent Manager, now a full SAS offering
        - Handed the proof of concept over to the development department as a productized and supported offering
        - Re-architecting configuration management within ESP/ESM so edge deployments stay reproducible at scale
      keywords:
        - Architecture
        - GenAI
        - RAG
        - LLM
        - Vector databases
        - SAS
        - Azure
        - Kubernetes
        - Docker
        - Python

    - name: SAS nv
      url: https://www.sas.com/
      position: Senior Technical Cloud Architect
      startDate: "2022-01"
      endDate: "2023-10"
      summary: |
        My main focus here was enabling customers in getting the SAS Viya suite installed and integrated in their current environment. As an analytic platform it integrated with almost every dataset in the company, which required a complex, well thought out architecture, designed together with the customer's business and technical teams so their requirements and use cases aligned.

        Next to the customer facing consulting I helped pre-sales architects work out sturdier and more modern architectures, usually starting from a simplified design of the final version and a PoC to prove our capabilities.

        - Helped DIGIT manage Tanzu clusters through ArgoCD and deliver the SAS suite as a SaaS product to the European Commission
        - Assisted a Dutch hospital chain in setting up Kubernetes GitOps IaC management through Azure pipelines
        - Integrated SAS into our justice department: not one big department but the sum of all local ones, with no shared standard, heavily regulated and handling sensitive personal data
      keywords:
        - Architecture
        - TOGAF
        - SAS
        - Azure
        - Google Cloud
        - AWS
        - Kubernetes
        - Ansible
        - Docker
        - ArgoCD

    - name: Dominion Experts bvba
      url: https://www.dominionexperts.be
      position: Competence Center Lead, SRE/DevOps Architect
      startDate: "2013-09"
      endDate: "2022-01"
      summary: |
        My main function was to lead a DevOps competence center. DevOps evokes thoughts of hip and trendy new tools which we utilized to show how much easier life can be with fail/fool-proof automating of even the most insignificant task. Just as important was shifting the mindset towards a continuous workflow while pushing people to take co-ownership and responsibility within a project. By looking at each task from a service perspective, we got more continuity and stability in the work we delivered.

        The assignments listed below were delivered as part of this role.

        - Automated the lifecycle of different platforms and applications
        - Predicted growth and requirements, and documented new flows
        - Built pipelines and inspired colleagues in the DevOps way of life
        - Checked that the internal competences stayed in line with the market
        - Guided colleagues on their external projects, recruited core skills, and coached on performance and behavior
        - Presented new technologies and how to implement them within our vision
      keywords:
        - DevOps
        - Architecture
        - Guidance
        - Coaching
        - Automation
        - Envisioning
        - Agile

    - name: UCB
      url: https://www.ucb.com/
      position: Technical Coordinator
      startDate: "2020-12"
      endDate: "2021-12"
      summary: |
        I was solely responsible for the technical coordination of the MyUCB project, the platform for patient to doctor interaction that gathered the required feedback for clinical studies. Because it was used for clinical studies and held confidential patient data, the platform had to be fully GxP validated before it could be released.

        The role had three distinct parts. As scrum master/PO I took care of the DevOps backlog, made sure the agile rituals were followed and that the stories needed to automate our work got written. For validation we had to qualify installation, operation and performance. I ran the IQ and automated as many manual steps as I could. The third part was debugging and error detection: the platform was deliberately designed without any output so no data could leak through stack traces, which meant searching blindly whenever errors occurred and led me to request more visibility later on.

        - Tried to automate everything
        - Made sure we delivered on the promises made
        - Debugged with blindfolds on
      keywords:
        - DevOps
        - Agile
        - Qualification
        - Azure
        - iOS/Swift
        - .NET/C#

