name: Release Resume

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "release"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/build.sh runs the pinned yamlresume container, which already
      # ships XeTeX and the fonts, so there is nothing else to install here.
      # It fails the job on schema violations.
      - name: Build resume
        run: ./scripts/build.sh

      - name: Collect release metadata
        id: meta
        run: |
          echo "tag=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +'%Y-%m-%d %H:%M:%S') UTC" >> "$GITHUB_OUTPUT"

      - name: Show generated artifacts
        run: ls -l output/

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "output/t-v-resume.pdf,output/t-v-resume.docx,output/t-v-resume.html,output/t-v-resume.md,output/t-v-resume.tex"
          body: "My from YAML generated resume.\nResume: ${{ steps.meta.outputs.built }}"
          name: "Curriculum Vitae"
          tag: "${{ steps.meta.outputs.tag }}"
