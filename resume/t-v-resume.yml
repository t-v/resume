# Shared section ordering and naming, kept close to the headings used by the
# previous Jinja2 templates. YAML anchors avoid repeating this per layout.
x-sections: &sections
  order:
    - basics
    - work
    - skills
    - projects
    - education
    - certificates
    - languages
    - interests
    - references
  aliases:
    basics: Profile
    work: Employment
    projects: Personal Projects
    certificates: Certification

layouts:
  - engine: html
    template: calm
    sections: *sections
    typography:
      fontFamily: Quicksand
      fontSize: 16px
      lineSpacing: normal
    advanced:
      title: Timothy Vandenbrande - Curriculum Vitae
      description: Curriculum Vitae of Timothy Vandenbrande, DevOps Architect.
      keywords: DevOps, Architecture, Kubernetes, Azure, GCP, AWS, Ansible, GenAI, RAG
      showIcons: true

  - engine: latex
    template: moderncv-banking
    sections: *sections
    page:
      margins:
        top: 2.0cm
        bottom: 2.0cm
        left: 1.5cm
        right: 1.5cm
      showPageNumbers: true
      paperSize: a4
    typography:
      # Matches the HTML. The static Quicksand faces in fonts/ are mounted into
      # the build container, because XeTeX cannot address the weights inside
      # Google's variable Quicksand. See scripts/make-fonts.py.
      fontFamily: Quicksand
      fontSize: 10pt
      links:
        underline: false
    advanced:
      fontspec:
        numbers: Lining
      showIcons: true
      # Mirrors the HTML, which hyperlinks the employer name instead of printing
      # the URL. Printing it puts the name and the URL in the same fixed-width
      # row, so a long employer name collides with its URL.
      showUrls: false

  - engine: docx
    template: calm
    sections: *sections
    page:
      margins:
        top: 2.0cm
        bottom: 2.0cm
        left: 1.5cm
        right: 1.5cm
      showPageNumbers: true
      paperSize: a4
    typography:
      # Readers without Quicksand installed will fall back to their default
      # sans; the PDF embeds the font and is the canonical download.
      fontFamily: Quicksand
      fontSize: 10pt
      lineSpacing: normal
    advanced:
      showUrls: true
      showIcons: true

  - engine: markdown
    sections: *sections
