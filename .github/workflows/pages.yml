# Builds the resume with yamlresume and deploys the HTML version to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # scripts/build.sh runs the pinned yamlresume container, which already
      # ships XeTeX and the fonts, so there is nothing else to install here.
      # It fails the job on schema violations.
      - name: Build resume
        run: ./scripts/build.sh

      - name: Prepare pages upload
        run: |
          mkdir -p pages
          cp output/t-v-resume.html pages/index.html
          # Keep the old filename around so existing links stay valid.
          cp output/t-v-resume.html pages/t-v-resume.html
          cp output/t-v-resume.pdf pages/t-v-resume.pdf
          chmod -R a+rX ./pages
          ls -la ./pages/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: "github-pages"
          path: './pages/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
